function spawnPickup(kind){
  const t=kind==='w'?pickStar:heartTex,s=new PIXI.Container();
  const size=gemSize()*1.05,dim=kind==='w'?Math.max(SW,SH):Math.max(HW,HH);s.baseScale=size/dim;s.rw=size/2;s.pk=kind;s.col=kind==='w'?0xffd24d:0xff5f7e;
  const glow=new PIXI.Sprite(artT(kind==='w'?'gs':'gh')),art=new PIXI.Sprite(t);glow.anchor.set(.5);art.anchor.set(.5);glow.blendMode=PIXI.BLEND_MODES.ADD;glow.alpha=.85;s.addChild(glow,art);
  s.z=7;s.ox=camX+(Math.random()*2-1)*W*.6;s.oy=camY+(Math.random()*2-1)*H*.45;s.vr=kind==='w'?.8:0;s.age=0;
  s.scale.set(0);gemLayer.addChild(s);gems.push(s);
}
function collect(kind,x,y){
  let msg,col;
  if(kind==='w'){wlevel++;msg=wlevel===1?'DOUBLE LASER!':'FIRE RATE UP!';col='#3df08c';burst(x,y,0x3df08c,18);sparkBurst(x,y,10)}
  else{lives=Math.min(5,lives+1);maxLives=Math.max(maxLives,lives);setHearts();msg='+1 HEART';col='#ff6b8a';burst(x,y,0xff5f7e,18);sparkBurst(x,y,10)}
  score+=25;popText(x,y,msg,col);shake=12;
  try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}
}
function hurt(x,y,col){
  lives--;setHearts();combo=0;hideCombo();burst(x,y,col,26);popText(x,y,'OUCH!','#ff6b8a');shake=34;flash.alpha=.5;
  try{navigator.vibrate&&navigator.vibrate([30,40,30])}catch(e){}
  if(lives<=0)showEnd();
}
function showEnd(){
  state='end';touching=false;tX=camX;tY=camY;scoreT.visible=false;bar.visible=barBg.visible=false;hearts.forEach(s=>s.visible=false);bullets.forEach(b=>b.s.destroy());bullets=[];gems.forEach(g=>g.destroy());gems=[];hideCombo();
  buildEnd(0);
  burst(W/2,H*.3,0xffd24d,40);
}
function buildEnd(a){
  if(endUI){endUI.c.destroy({children:true});endUI=null}
  const c=new PIXI.Container();
  const dim=new PIXI.Graphics().beginFill(0x0b0620,.82).drawRect(0,0,W,H).endFill();dim.eventMode='static';
  const title=new PIXI.Sprite(LOGO);title.anchor.set(.5);title.x=W/2;title.y=H*.3;title.width=Math.min(W*.85,560);title.scale.y=title.scale.x;
  const sc=txt(40);sc.text='Score: '+score;sc.anchor.set(.5);sc.x=W/2;sc.y=H*.3+title.height/2+70;
  const bw=Math.min(W*.8,360),btn=new PIXI.Container();
  const bg=new PIXI.Graphics().beginFill(0x71C299).lineStyle(5,0x111111).drawRoundedRect(-bw/2,-40,bw,80,40).endFill();
  const bt=new PIXI.Sprite(TX_PLAY);bt.anchor.set(.5);bt.scale.set(bw*.52/PL_W);
  const bt2=txt(30,'#1a0a40');bt2.style.strokeThickness=0;bt2.text='→ STORE LINK';bt2.anchor.set(.5);bt2.visible=false;
  btn.addChild(bg,bt,bt2);btn.x=W/2;btn.y=sc.y+105;btn.eventMode='static';btn.cursor='pointer';
  btn.on('pointerdown',()=>{bt.visible=false;bt2.visible=true;clearTimeout(btn.tm);btn.tm=setTimeout(()=>{bt.visible=true;bt2.visible=false},1200)});
  const rp=txt(24);rp.text='↻ replay demo';rp.anchor.set(.5);rp.x=W/2;rp.y=btn.y+88;rp.alpha=.8;rp.eventMode='static';rp.cursor='pointer';rp.on('pointerdown',reset);
  const sparks=[];
  const hw=title.width/2,hh=title.height/2;
  for(let i=0;i<14;i++){const ang=i/14*Math.PI*2+Math.random()*.35,cx=Math.cos(ang),cy=Math.sin(ang);
    if(cy>.55&&Math.abs(cx)<.65)continue;
    const st=sparkTex[Math.random()*sparkTex.length|0],sp=new PIXI.Sprite(st.t);sp.anchor.set(.5);
    const px=Math.min(W,H)*(.045+Math.random()*.05),edge=Math.min(hw/Math.max(Math.abs(cx),.001),hh/Math.max(Math.abs(cy),.001)),d=edge+px/2+14+Math.random()*34;
    sp.x=Math.max(px/2+6,Math.min(W-px/2-6,W/2+cx*d));sp.y=title.y+cy*d;
    sp.b=px/st.d;sp.ph=Math.random()*6.28;sp.sp=1.5+Math.random()*2;sp.rotation=(Math.random()-.5)*.6;sp.scale.set(sp.b);sparks.push(sp)}
  const deco=[],pick=planets.slice().sort(()=>Math.random()-.5);
  [[.1,.09,.2],[.9,.07,.15],[.06,.84,.34],[.93,.9,.38],[.5,.98,.2]].forEach((d,i)=>{const p=pick[i%pick.length],sp=new PIXI.Sprite(p.t),sz=Math.min(W,H)*d[2];
    sp.anchor.set(.5);sp.scale.set(sz/Math.max(p.w,p.h));sp.x=W*d[0];sp.by=sp.y=H*d[1];sp.vr=(Math.random()<.5?-1:1)*(.08+Math.random()*.12);sp.ph=Math.random()*6.28;deco.push(sp)});
  c.addChild(dim,...deco,title,...sparks,sc,btn,rp);c.alpha=a;hud.addChild(c);endUI={c,btn,sparks,deco};
}

function reset(){
  if(endUI){endUI.c.destroy({children:true});endUI=null}
  score=0;combo=0;comboTimer=0;timeLeft=GAME_TIME;elapsed=0;spawnT=0;state='play';shownScore=-1;scoreT.visible=true;bar.visible=barBg.visible=true;lives=3;maxLives=3;wlevel=0;bonusT=4;heartT=12;setHearts();bullets.forEach(b=>b.s.destroy());bullets=[];camX=camY=tX=tY=0;ax=tAx=W/2;ay=tAy=H*.5;hideCombo();
}

function aim(e){if(state!=='play')return;const r=app.view.getBoundingClientRect();tAx=(e.clientX-r.left)/r.width*W;tAy=(e.clientY-r.top)/r.height*H}
let touching=false,dragX0=0,dragY0=0,cam0X=0,cam0Y=0;
function drag(){tX=Math.max(-W,Math.min(W,cam0X+(tAx-dragX0)*1.6));tY=Math.max(-H*1.2,Math.min(H*1.2,cam0Y+(tAy-dragY0)*1.4))}
app.view.addEventListener('pointerdown',e=>{if(state!=='play')return;touching=true;hint.visible=false;aim(e);dragX0=tAx;dragY0=tAy;cam0X=camX;cam0Y=camY;tX=camX;tY=camY});
window.addEventListener('pointermove',e=>{if(touching){aim(e);drag()}});
window.addEventListener('pointerup',()=>{touching=false});
layout();
const refreshFont=()=>{PIXI.TextMetrics.clearMetrics();[scoreT,comboT,hint].forEach(t=>{t.dirty=true})};
if(document.fonts){document.fonts.load('40px Chewy').then(refreshFont).catch(()=>{});document.fonts.ready.then(refreshFont)}

// ---- Main loop ----
app.ticker.add(()=>{
  const dt=Math.min(app.ticker.deltaMS/1000,.05),now=performance.now()/1000;
  const VX=W/2,VY=H*.5,MR=Math.hypot(W,H)*.6;
  stars.forEach(s=>{s.r=s.r*(1+dt*.7)+dt*10;if(s.r>MR){s.r=Math.random()*20;s.a=Math.random()*Math.PI*2}
    const q=s.r/MR;s.x=VX+Math.cos(s.a)*s.r-camX*q*.35;s.y=VY+Math.sin(s.a)*s.r-camY*q*.35;s.scale.set(.15+q*1.1);s.alpha=Math.min(.85,.2+q*1.5)});
  if(state==='play'){
    elapsed+=dt;timeLeft-=dt;spawnT-=dt;bonusT-=dt;heartT-=dt;
    if(bonusT<=0){if(wlevel<8)spawnPickup('w');bonusT=Math.max(3.5,9-elapsed*.16)}
    if(heartT<=0){if(lives<5)spawnPickup('h');heartT=13}
    if(spawnT<=0){spawn();spawnT=Math.max(.16,.6-elapsed*.014)}
    if(comboTimer>0){comboTimer-=dt;if(comboTimer<=0){combo=0;hideCombo()}}
    if(timeLeft<=0)showEnd();
  }
  for(let i=gems.length-1;i>=0;i--){
    const s=gems[i];s.age+=dt;s.z-=(2.6+elapsed*.03)*dt;const k=1/Math.max(s.z,.05);
    s.x=VX+(s.ox-camX)*k;s.y=VY+(s.oy-camY)*k;s.rotation+=s.vr*dt;s.scale.set(s.baseScale*k);s.alpha=Math.min(1,s.age*2.5);s.zIndex=k;
    if(!s.hitDone&&s.z<=.4&&state==='play'){s.hitDone=true;if(Math.hypot(s.ox-camX,s.oy-camY)<s.rw+gemSize()*(s.pk?.7:.55)){const hx=s.x,hy=s.y,hc=s.col,pk=s.pk;gemLayer.removeChild(s);s.destroy();gems.splice(i,1);if(pk)collect(pk,hx,hy);else hurt(hx,hy,hc);if(state!=='play')break;continue}}
    const rd=s.width/2;
    if(s.z<.08||s.x+rd<0||s.x-rd>W||s.y+rd<0||s.y-rd>H){gemLayer.removeChild(s);s.destroy();gems.splice(i,1)}
  }
  ax+=(tAx-ax)*Math.min(1,dt*28);ay+=(tAy-ay)*Math.min(1,dt*28);cross.x=ax;cross.y=ay;
  camX+=(tX-camX)*Math.min(1,dt*18);camY+=(tY-camY)*Math.min(1,dt*18);
  if(state==='play'){fireT-=dt;if(fireT<=0){fireT=Math.max(.22,.8*Math.pow(.78,Math.max(0,wlevel-1)));
    (wlevel>=1?[-1,1]:[0]).forEach(sd=>{const sp=new PIXI.Sprite(dotTex);sp.anchor.set(.5);sp.blendMode=PIXI.BLEND_MODES.ADD;sp.tint=0x3df08c;fxLayer.addChild(sp);
      bullets.push({cx:camX,cy:camY,mx:sd*W*.07,my:H*.05,ux:ax-VX,uy:ay-VY,z:.25,s:sp})})}}
  const dzp=(2.6+elapsed*.03)*dt;
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i],zp=b.z;b.z+=9*dt;let hit=false;const f=Math.max(0,1-b.z/3),bx=b.cx+b.mx*f+b.ux*b.z,by=b.cy+b.my*f+b.uy*b.z;
    for(const g of gems.slice()){
      if(g.dead||g.pk)continue;
      if(zp<=g.z+dzp&&b.z>=g.z&&Math.hypot(bx-g.ox,by-g.oy)<g.rw*1.5+gemSize()*.2){pop(g);cross.scale.set(1.5);hit=true;break}
    }
    if(hit||b.z>9){b.s.destroy();bullets.splice(i,1);continue}
    const k=1/b.z,sx=VX+(bx-camX)*k,sy=VY+(by-camY)*k,sz=Math.max(.12,Math.min(1.4,.7/b.z));
    b.s.x=sx;b.s.y=sy;b.s.rotation=Math.atan2(sy-VY,sx-VX);b.s.scale.set(sz*2.4,sz*.8);
  }
  flash.alpha=Math.max(0,flash.alpha-dt*2.2);cross.scale.set(Math.max(1,cross.scale.x-dt*3));cross.visible=state==='play';
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.life-=dt;
    if(p.life<=0){p.destroy();parts.splice(i,1);continue}
    const t=p.life/p.max;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.alpha=t;p.scale.set(Math.max(.01,p.s0+(1-t)*p.grow*(p.grow>0?1:.3)));
  }
  for(let i=floats.length-1;i>=0;i--){
    const t=floats[i];t.life-=dt;if(t.life<=0){t.destroy();floats.splice(i,1);continue}
    t.y-=70*dt;t.alpha=Math.min(1,t.life*3);t.scale.set(Math.min(1,t.scale.x+dt*8));
  }
  comboT.scale.set(Math.max(1,comboT.scale.x-dt*4));
    shake=Math.max(0,shake-dt*60);world.x=(Math.random()-.5)*shake;world.y=(Math.random()-.5)*shake;
  if(shownScore!==score){scoreT.text='Score '+score;shownScore=score}
  const f=Math.max(0,timeLeft/GAME_TIME);
  bar.clear().beginFill(f>.25?0x7dff6b:0xff4d8d).drawRoundedRect(18,14,Math.max(0,(W-36)*f),10,5).endFill();
  if(hint.visible){hint.alpha=.6+.4*Math.sin(now*6);if(elapsed>4)hint.visible=false}
  if(endUI){endUI.c.alpha=Math.min(1,endUI.c.alpha+dt*3);const p=1+Math.sin(now*5)*.05;endUI.btn.scale.set(p);endUI.deco.forEach(s=>{s.rotation+=s.vr*dt;s.y=s.by+Math.sin(now*.8+s.ph)*6});endUI.sparks.forEach(s=>{const w=(Math.sin(now*s.sp+s.ph)+1)/2;s.alpha=.15+.85*w;s.scale.set(s.b*(.6+.4*w))})}
});
</script>
</body>
